spring.application.name=listing-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/foodsurplus
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=listing-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodsurplus.listing

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Server Configuration
server.port=8081

spring.jmx.enabled=false
# Keycloak / JWT Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/surplus
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/surplus/protocol/openid-connect/certs

# Keycloak Configuration
keycloak.adminClientId=listing-client
keycloak.adminClientSecret=ai7NMHdhIvQNqT2XBR3nSaPXdSZ8orUy
keycloak.urls.auth=http://localhost:8180
keycloak.realm=surplus
jwt.auth.converter.resource-id=surplus-client

# Validation Configuration
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
